<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SatQuery AI — console</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --ink:#e6edf3;
    --dim:#8b949e; --acc:#2f81f7; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 22px;border-bottom:1px solid var(--line);
         display:flex;align-items:baseline;gap:13px;flex-wrap:wrap}
  h1{margin:0;font-size:17px;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:12px}
  .pill{margin-left:auto;font:11px var(--mono);padding:3px 9px;border-radius:99px;
        border:1px solid var(--line);color:var(--dim)}
  .pill.on{color:var(--ok);border-color:#1f6f3d}
  .pill.off{color:var(--bad);border-color:#6e2b28}
  main{display:grid;grid-template-columns:minmax(340px,1fr) minmax(360px,1.1fr);
       gap:16px;padding:18px 22px;max-width:1500px}
  @media(max-width:940px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px}
  .card+.card{margin-top:16px}
  .card h2{margin:0 0 11px;font-size:12px;text-transform:uppercase;
           letter-spacing:.08em;color:var(--dim);font-weight:600}
  label{display:block;font-size:12px;color:var(--dim);margin:9px 0 4px}
  input[type=text],input[type=date],input[type=number],select,textarea{
    width:100%;background:#0d1117;color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit}
  textarea{resize:vertical;min-height:58px}
  input[type=file]{width:100%;font-size:12px;color:var(--dim)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  button{background:var(--acc);color:#fff;border:0;border-radius:7px;
         padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);
               font-weight:500;padding:7px 12px}
  .tabs{display:flex;gap:6px;margin-bottom:13px}
  .tab{flex:1;padding:8px;text-align:center;border:1px solid var(--line);
       border-radius:7px;cursor:pointer;font-size:13px;color:var(--dim);background:transparent}
  .tab.sel{background:#1f2937;color:var(--ink);border-color:var(--acc)}
  #map{height:330px;border-radius:8px;border:1px solid var(--line);
       background:#0b0e13;cursor:crosshair}
  .leaflet-container{background:#0b0e13}
  .hint{font-size:11px;color:var(--dim);margin-top:7px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{font-size:11px;padding:4px 9px;border:1px solid var(--line);
        border-radius:99px;color:var(--dim);cursor:pointer;background:transparent}
  .chip:hover{border-color:var(--acc);color:var(--ink)}
  .previews{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
            gap:9px;margin-top:11px}
  .pv{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#0b0e13}
  .pv img{width:100%;display:block;aspect-ratio:1;object-fit:cover}
  .pv .cap{padding:5px 7px;font:10px var(--mono);color:var(--dim);
           border-top:1px solid var(--line)}
  .answer{font-size:15px;line-height:1.6;margin:0 0 13px;white-space:pre-wrap}
  .meta{display:flex;gap:15px;flex-wrap:wrap;font:11px var(--mono);color:var(--dim);
        padding-bottom:11px;border-bottom:1px solid var(--line);margin-bottom:11px}
  .meta b{color:var(--ink);font-weight:600}
  table{width:100%;border-collapse:collapse;font:11px var(--mono)}
  th{text-align:left;color:var(--dim);font-weight:500;padding:5px 6px;
     border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:5px 6px;border-bottom:1px solid #21262d;vertical-align:top}
  td.num{text-align:right}
  .tag{font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
  .tag.stub{color:var(--warn);border-color:#6b4b12}
  .tag.real{color:var(--ok);border-color:#1f6f3d}
  .note{border-left:3px solid var(--warn);padding:9px 12px;background:#1c1710;
        border-radius:0 7px 7px 0;margin-bottom:11px;font-size:12px}
  .note b{color:var(--warn)}
  .muted{color:var(--dim);font-size:12px}
  .err{color:var(--bad);font-size:12px;margin-top:8px;font-family:var(--mono)}
  .models{display:grid;gap:5px;margin-top:3px}
  .m{display:flex;gap:8px;align-items:center;font:11px var(--mono);
     padding:5px 8px;border:1px solid var(--line);border-radius:6px}
  .m .id{color:var(--acc);font-weight:600;min-width:28px}
  .m .nm{flex:1}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);
        border-top-color:var(--acc);border-radius:50%;animation:s .7s linear infinite;
        vertical-align:-2px;margin-right:7px}
  @keyframes s{to{transform:rotate(360deg)}}
  .hidden{display:none!important}

  /* ─── PRELOADER ─────────────────────────────────────────── */
  .sq-preloader {
    position:fixed;inset:0;z-index:9999;
